<!doctype html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827"><title>Casa3D v3</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef1f5;color:#172033;overflow:hidden}button,input,select{font:inherit}button{min-height:42px;border:1px solid #d4dae4;background:#fff;border-radius:9px;padding:7px 9px;color:#172033}button:active{transform:scale(.98)}
.app{height:100%;display:grid;grid-template-rows:58px 1fr}.top{display:flex;align-items:center;gap:7px;padding:7px 10px;background:#111827;color:#fff}.brand{font-weight:800;font-size:20px;margin-right:auto}.top button{color:#172033;min-height:40px}.top .active{background:#dbeafe;border-color:#60a5fa}.body{min-height:0;display:grid;grid-template-columns:235px minmax(0,1fr) 260px}.left,.right{background:#f8fafc;overflow:auto;padding:9px;border-right:1px solid #d8dee8}.right{border-right:0;border-left:1px solid #d8dee8}.panel-title{font-weight:800;margin:4px 2px 9px}.group{margin-bottom:11px}.group h3{font-size:12px;color:#667085;margin:9px 3px 5px}.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tool{text-align:left}.tool.active{background:#dbeafe;border-color:#60a5fa}.canvas-wrap{position:relative;min-width:0;min-height:0;background:#fff;overflow:hidden}.canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;background:#fff}.hint{position:absolute;left:10px;top:10px;max-width:70%;background:rgba(255,255,255,.94);border:1px solid #d8dee8;border-radius:10px;padding:7px 9px;font-size:12px;pointer-events:none}.bottom{position:absolute;left:10px;right:10px;bottom:10px;display:flex;gap:6px;justify-content:center;flex-wrap:wrap;pointer-events:none}.bottom button{pointer-events:auto}.field{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:7px}.field label,.full label{font-size:11px;color:#667085;display:flex;flex-direction:column;gap:3px}input,select{min-height:39px;border:1px solid #d4dae4;border-radius:8px;padding:6px;background:#fff;width:100%}.card{background:#fff;border:1px solid #dde2ea;border-radius:10px;padding:8px;margin-bottom:8px}.row{display:flex;gap:6px;align-items:center}.row>*{flex:1}.small{font-size:11px;color:#667085;line-height:1.35}.big{font-size:18px;font-weight:800}.danger{color:#b42318}.tabs{display:flex;gap:5px;overflow:auto;margin-bottom:7px}.tabs button{white-space:nowrap}.tabs .active{background:#111827;color:#fff}.hidden{display:none!important}.list{max-height:170px;overflow:auto}.item{display:flex;justify-content:space-between;gap:5px;padding:5px 0;border-bottom:1px solid #edf0f4;font-size:12px}.item:last-child{border-bottom:0}.badge{display:inline-block;padding:2px 6px;border-radius:20px;background:#eef2f6;font-size:10px}.modal{position:absolute;inset:0;background:rgba(15,23,42,.4);display:flex;align-items:center;justify-content:center;padding:15px;z-index:20}.modalbox{background:#fff;border-radius:14px;max-width:560px;width:100%;max-height:90%;overflow:auto;padding:14px}.toast{position:absolute;left:50%;bottom:62px;transform:translateX(-50%);background:#111827;color:#fff;padding:8px 11px;border-radius:9px;font-size:12px;opacity:0;transition:.2s;pointer-events:none;z-index:30}.toast.show{opacity:1}.legend{font-size:11px;color:#667085}.swatch{width:25px;height:25px;border-radius:6px;border:1px solid #ccd3de}.material-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.material-grid button{text-align:left}.footer-note{font-size:10px;color:#98a2b3;margin-top:8px}
@media(max-width:900px){.body{grid-template-columns:195px minmax(0,1fr)}.right{display:none}.toolgrid{grid-template-columns:1fr}.top .extra{display:none}}
@media(max-width:620px){.body{grid-template-columns:84px minmax(0,1fr)}.left{padding:5px}.panel-title,.group h3,.tool span.txt{display:none}.toolgrid{gap:4px}.tool{text-align:center;font-size:11px;padding:5px 2px}.top{padding:6px}.brand{font-size:17px}.top button{font-size:11px;padding:5px 6px}.hint{font-size:11px;max-width:80%}}
</style></head>
<body><div class="app">
<header class="top"><div class="brand">Casa3D</div><button id="floorBtn">Planta 0</button><button id="view2d" class="active">2D</button><button id="view3d">3D</button><button id="walk">Recorrido</button><button id="more" class="extra">Más</button></header>
<div class="body"><aside class="left"><div class="panel-title">Herramientas</div>
<div class="group"><h3>Construcción</h3><div class="toolgrid">
<button class="tool active" data-tool="select">↖ <span class="txt">Seleccionar</span></button><button class="tool" data-tool="wall">▰ <span class="txt">Pared</span></button><button class="tool" data-tool="room">□ <span class="txt">Habitación</span></button><button class="tool" data-tool="door">🚪 <span class="txt">Puerta</span></button><button class="tool" data-tool="window">▣ <span class="txt">Ventana</span></button><button class="tool" data-tool="stairs">▤ <span class="txt">Escalera</span></button></div></div>
<div class="group"><h3>Interior</h3><div class="toolgrid"><button class="tool" data-tool="sofa">🛋️ <span class="txt">Sofá</span></button><button class="tool" data-tool="bed">🛏️ <span class="txt">Cama</span></button><button class="tool" data-tool="table">▦ <span class="txt">Mesa</span></button><button class="tool" data-tool="kitchen">🍳 <span class="txt">Cocina</span></button><button class="tool" data-tool="bath">🚿 <span class="txt">Baño</span></button><button class="tool" data-tool="wardrobe">▥ <span class="txt">Armario</span></button></div></div>
<div class="group"><h3>Exterior</h3><div class="toolgrid"><button class="tool" data-tool="pool">▱ <span class="txt">Piscina</span></button><button class="tool" data-tool="terrace">▱ <span class="txt">Terraza</span></button><button class="tool" data-tool="garage">▣ <span class="txt">Garaje</span></button><button class="tool" data-tool="garden">♧ <span class="txt">Jardín</span></button></div></div>
<div class="group"><h3>Materiales</h3><div class="toolgrid"><button class="tool" data-tool="mat-wall">Pared</button><button class="tool" data-tool="mat-floor">Suelo</button><button class="tool" data-tool="mat-roof">Techo</button><button class="tool" data-tool="mat-wood">Madera</button></div></div>
<div class="group"><h3>Medición</h3><div class="toolgrid"><button class="tool" data-tool="measure">📏 <span class="txt">Cota</span></button><button class="tool" data-tool="guide">⌖ <span class="txt">Guía</span></button></div></div>
</aside>
<main class="canvas-wrap"><canvas id="canvas" class="canvas"></canvas><div class="hint" id="hint">Seleccionar: toca un elemento para editarlo.</div><div class="bottom"><button id="undo">↶</button><button id="redo">↷</button><button id="save">Guardar</button><button id="clear">Limpiar</button></div><div id="toast" class="toast"></div></main>
<aside class="right"><div class="panel-title">Propiedades</div><div id="props"></div></aside></div></div>
<div id="modal" class="modal hidden"><div class="modalbox" id="modalbox"></div></div>
<script>
(()=>{
const c=document.getElementById('canvas'),ctx=c.getContext('2d'),props=document.getElementById('props'),hint=document.getElementById('hint'),toast=document.getElementById('toast'),modal=document.getElementById('modal'),modalbox=document.getElementById('modalbox');
let dpr=1,view='2d',tool='select',drag=null,selected=null,history=[],future=[],scale=45,offset={x:70,y:70},floor=0;
const key='casa3d-v3-project';
let project={name:'Mi casa',floors:[{name:'Planta 0',height:2.7,objects:[]}],materials:{wall:'#d9d3c7',floor:'#e8e2d6',roof:'#c6c0b8',wood:'#b8895a'},prices:{wall:55,floor:35,roof:45,wood:80},settings:{snap:.25}};
const TYPES={wall:'Pared',room:'Habitación',door:'Puerta',window:'Ventana',stairs:'Escalera',sofa:'Sofá',bed:'Cama',table:'Mesa',kitchen:'Cocina',bath:'Baño',wardrobe:'Armario',pool:'Piscina',terrace:'Terraza',garage:'Garaje',garden:'Jardín',measure:'Cota',guide:'Guía'};
function cur(){return project.floors[floor].objects} function snapM(v){let s=project.settings.snap;return Math.round(v/s)*s} function resize(){dpr=Math.min(devicePixelRatio||1,2);let r=c.getBoundingClientRect();c.width=Math.max(1,r.width*dpr);c.height=Math.max(1,r.height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);draw()} function p2s(p){return{x:p.x*scale+offset.x,y:p.y*scale+offset.y}} function s2p(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left-offset.x)/scale,y:(e.clientY-r.top-offset.y)/scale}}
function uid(){return Math.random().toString(36).slice(2,9)} function clone(o){return JSON.parse(JSON.stringify(o))} function saveHist(){history.push(JSON.stringify(project));if(history.length>30)history.shift();future=[]} function persist(){localStorage.setItem(key,JSON.stringify(project))} function load(){try{let a=JSON.parse(localStorage.getItem(key));if(a&&a.floors)project=a}catch(e){}} function toastMsg(t){toast.textContent=t;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1300)}
function roomArea(o){return Math.abs((o.w||0)*(o.h||0))} function wallLen(o){return Math.hypot(o.x2-o.x1,o.y2-o.y1)} function bounds(){let xs=[],ys=[];cur().forEach(o=>{if(o.x!=null){xs.push(o.x,o.x+(o.w||0));ys.push(o.y,o.y+(o.h||0))}if(o.x1!=null){xs.push(o.x1,o.x2);ys.push(o.y1,o.y2)}});return xs.length?{minx:Math.min(...xs),maxx:Math.max(...xs),miny:Math.min(...ys),maxy:Math.max(...ys)}:{minx:0,maxx:10,miny:0,maxy:8}}
function setupView(){let b=bounds(),w=b.maxx-b.minx||10,h=b.maxy-b.miny||8;let r=c.getBoundingClientRect();scale=Math.min((r.width-60)/Math.max(w,8),(r.height-60)/Math.max(h,6),70);offset.x=(r.width-w*scale)/2-b.minx*scale;offset.y=(r.height-h*scale)/2-b.miny*scale}
function drawGrid(){ctx.save();ctx.fillStyle='#fff';ctx.fillRect(0,0,c.clientWidth,c.clientHeight);let step=scale;ctx.strokeStyle='#e7ebf1';ctx.lineWidth=1;for(let x=((offset.x%step)+step)%step;x<c.clientWidth;x+=step){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,c.clientHeight);ctx.stroke()}for(let y=((offset.y%step)+step)%step;y<c.clientHeight;y+=step){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.clientWidth,y);ctx.stroke()}ctx.restore()}
function draw2d(){setupView();drawGrid();let objs=cur();objs.forEach(o=>{let sel=o.id===selected;ctx.save();if(o.type==='wall'){let a=p2s({x:o.x1,y:o.y1}),b=p2s({x:o.x2,y:o.y2});ctx.strokeStyle=sel?'#2563eb':'#374151';ctx.lineWidth=Math.max(4,(o.thickness||.2)*scale);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();let len=wallLen(o);if(len>.6){ctx.fillStyle='#475467';ctx.font='11px sans-serif';ctx.fillText(len.toFixed(2)+' m',(a.x+b.x)/2+4,(a.y+b.y)/2-5)}}else if(o.type==='room'||['pool','terrace','garage','garden'].includes(o.type)){let a=p2s({x:o.x,y:o.y});ctx.fillStyle=o.type==='pool'?'#cfe8f5':o.type==='garden'?'#dcefd8':o.type==='terrace'?'#eee8dd':o.type==='garage'?'#e5e7eb':'rgba(59,130,246,.08)';ctx.fillRect(a.x,a.y,o.w*scale,o.h*scale);ctx.strokeStyle=sel?'#2563eb':'#64748b';ctx.lineWidth=sel?3:1.5;ctx.strokeRect(a.x,a.y,o.w*scale,o.h*scale);if(o.name){ctx.fillStyle='#344054';ctx.font='12px sans-serif';ctx.fillText(o.name,a.x+6,a.y+16)}if(o.type==='room'){ctx.fillText(roomArea(o).toFixed(2)+' m²',a.x+6,a.y+32)}}else if(o.type==='door'||o.type==='window'){let a=p2s({x:o.x,y:o.y});ctx.strokeStyle=o.type==='door'?'#2563eb':'#16a34a';ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(a.x-(o.w||.8)*scale/2,a.y);ctx.lineTo(a.x+(o.w||.8)*scale/2,a.y);ctx.stroke()}else if(o.type==='measure'||o.type==='guide'){let a=p2s({x:o.x1,y:o.y1}),b=p2s({x:o.x2,y:o.y2});ctx.strokeStyle=o.type==='measure'?'#f59e0b':'#94a3b8';ctx.setLineDash([5,4]);ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.setLineDash([]);if(o.type==='measure'){ctx.fillStyle='#92400e';ctx.font='11px sans-serif';ctx.fillText(Math.hypot(o.x2-o.x1,o.y2-o.y1).toFixed(2)+' m',(a.x+b.x)/2+4,(a.y+b.y)/2-4)}}else{let a=p2s({x:o.x,y:o.y}),w=o.w||1,h=o.h||1;ctx.fillStyle=o.type==='stairs'?'#d1d5db':o.type==='kitchen'?'#f3e8d0':o.type==='bath'?'#dbeafe':o.type==='bed'?'#f5d0d0':o.type==='sofa'?'#ddd6fe':'#e5e7eb';ctx.fillRect(a.x-w*scale/2,a.y-h*scale/2,w*scale,h*scale);ctx.strokeStyle=sel?'#2563eb':'#667085';ctx.lineWidth=1.5;ctx.strokeRect(a.x-w*scale/2,a.y-h*scale/2,w*scale,h*scale);ctx.fillStyle='#344054';ctx.font='10px sans-serif';ctx.fillText(TYPES[o.type]||o.type,a.x-w*scale/2+3,a.y+3)}});ctx.restore()});}
function draw3d(){ctx.fillStyle='#eef1f5';ctx.fillRect(0,0,c.clientWidth,c.clientHeight);let b=bounds(),ox= c.clientWidth/2, oy= c.clientHeight*.62, s=Math.min(c.clientWidth/(b.maxx-b.minx+10),c.clientHeight/(b.maxy-b.miny+7))*0.7;function iso(x,y,z){return{x:ox+(x-y)*s,y:oy+(x+y)*s*.48-z*s}};cur().forEach(o=>{if(o.type==='room'||['pool','terrace','garage','garden'].includes(o.type)){let z=0,a=iso(o.x,o.y,z),b1=iso(o.x+o.w,o.y,z),c1=iso(o.x+o.w,o.y+o.h,z),d=iso(o.x,o.y+o.h,z);ctx.fillStyle=o.type==='pool'?'#9fd4eb':o.type==='garden'?'#b9d8ae':'#ddd6c9';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b1.x,b1.y);ctx.lineTo(c1.x,c1.y);ctx.lineTo(d.x,d.y);ctx.closePath();ctx.fill();ctx.strokeStyle='#64748b';ctx.stroke()}if(o.type==='wall'){let h=project.floors[floor].height||2.7,a=iso(o.x1,o.y1,0),b1=iso(o.x2,o.y2,0),c1=iso(o.x2,o.y2,h),d=iso(o.x1,o.y1,h);ctx.fillStyle=project.materials.wall;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b1.x,b1.y);ctx.lineTo(c1.x,c1.y);ctx.lineTo(d.x,d.y);ctx.closePath();ctx.fill();ctx.strokeStyle='#6b7280';ctx.stroke();}});cur().filter(o=>!['wall','room','pool','terrace','garage','garden','door','window','measure','guide'].includes(o.type)).forEach(o=>{let q=iso(o.x,o.y,0.5),w=(o.w||1)*s*.5;ctx.fillStyle='#b8b0a6';ctx.fillRect(q.x-w/2,q.y-w/2,w,w*.6)});ctx.fillStyle='#344054';ctx.font='13px sans-serif';ctx.fillText('Vista 3D · Planta '+floor,15,22)}
function draw(){view==='2d'?draw2d():draw3d()}
function setTool(t){tool=t;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));const m={select:'Seleccionar: toca un elemento para editarlo.',wall:'Pared: arrastra y suelta. Se ajusta a la cuadrícula.',room:'Habitación: arrastra un rectángulo.',door:'Puerta: toca cerca de un muro.',window:'Ventana: toca cerca de un muro.',stairs:'Escalera: toca para colocar.',measure:'Cota: arrastra para medir.',guide:'Guía: arrastra una línea.'};hint.textContent=m[t]||'Toca para colocar '+(TYPES[t]||'objeto')+'.'}
function hit(p){let best=null,bd=Infinity;cur().forEach(o=>{let d=Infinity;if(o.x!=null)d=Math.hypot(p.x-o.x,p.y-o.y)/(Math.max(o.w||.5,o.h||.5));if(o.x1!=null){let A={x:o.x1,y:o.y1},B={x:o.x2,y:o.y2};let vx=B.x-A.x,vy=B.y-A.y,t=((p.x-A.x)*vx+(p.y-A.y)*vy)/(vx*vx+vy*vy||1);t=Math.max(0,Math.min(1,t));d=Math.hypot(p.x-(A.x+t*vx),p.y-(A.y+t*vy))}if(d<bd&&d<.45){bd=d;best=o.id}});return best}
function newObj(t,p){let base={id:uid(),type:t,x:snapM(p.x),y:snapM(p.y),w:1,h:1,rotation:0};if(t==='door'||t==='window'){base.w=t==='door'?.8:1.2;base.h=.1}else if(t==='sofa'){base.w=2;base.h=.9}else if(t==='bed'){base.w=1.6;base.h=2}else if(t==='table'){base.w=1.2;base.h=1.2}else if(t==='kitchen'){base.w=2.8;base.h=.65}else if(t==='bath'){base.w=1.7;base.h=1.7}else if(t==='wardrobe'){base.w=1.8;base.h=.6}else if(t==='stairs'){base.w=1.1;base.h=2.8}else if(t==='pool'){base.w=5;base.h=3}else if(t==='terrace'){base.w=4;base.h=2.5}else if(t==='garage'){base.w=3;base.h=5}else if(t==='garden'){base.w=5;base.h=4}return base}
function pointerDown(e){e.preventDefault();let p=s2p(e);if(view!=='2d'){return}if(tool==='select'){selected=hit(p);showProps();draw();return}c.setPointerCapture(e.pointerId);if(['wall','room','measure','guide'].includes(tool)){drag={x1:snapM(p.x),y1:snapM(p.y),x2:snapM(p.x),y2:snapM(p.y)}}else{saveHist();let o=newObj(tool,p);cur().push(o);selected=o.id;showProps();persist();draw()}}
function pointerMove(e){if(!drag)return;e.preventDefault();let p=s2p(e);drag.x2=snapM(p.x);drag.y2=snapM(p.y);draw();if(view==='2d'){let a=p2s({x:drag.x1,y:drag.y1}),b=p2s({x:drag.x2,y:drag.y2});ctx.save();ctx.strokeStyle='#2563eb';ctx.lineWidth=3;ctx.setLineDash([7,5]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();ctx.restore()}}
function pointerUp(e){if(!drag)return;e.preventDefault();let d=drag;drag=null;saveHist();let o;if(tool==='wall')o={id:uid(),type:'wall',x1:d.x1,y1:d.y1,x2:d.x2,y2:d.y2,thickness:.2,height:project.floors[floor].height};else if(tool==='room')o={id:uid(),type:'room',x:Math.min(d.x1,d.x2),y:Math.min(d.y1,d.y2),w:Math.abs(d.x2-d.x1),h:Math.abs(d.y2-d.y1),name:'Habitación'};else o={id:uid(),type:tool,x1:d.x1,y1:d.y1,x2:d.x2,y2:d.y2};cur().push(o);selected=o.id;persist();showProps();draw()}
function propInput(label,key,val,step='.1'){return `<label>${label}<input data-key="${key}" type="number" step="${step}" value="${val??''}"></label>`}
function showProps(){let o=cur().find(a=>a.id===selected);if(!o){let rooms=cur().filter(a=>a.type==='room').reduce((s,a)=>s+roomArea(a),0),walls=cur().filter(a=>a.type==='wall').reduce((s,a)=>s+wallLen(a),0);props.innerHTML=`<div class="card"><div class="big">${project.name}</div><div class="small">${cur().length} elementos · ${rooms.toFixed(2)} m² de habitaciones · ${walls.toFixed(2)} m de muros</div></div><div class="card"><div class="row"><button id="floors">Plantas</button><button id="budget">Presupuesto</button></div><div class="row"><button id="export">Exportar</button><button id="import">Importar</button></div></div><div class="card"><div class="small">Toca un elemento para editarlo. El proyecto se guarda automáticamente en este iPad.</div></div>`;bindGeneral();return}let html=`<div class="card"><div class="big">${TYPES[o.type]||o.type}</div><div class="small">ID ${o.id}</div></div>`;if(o.type==='wall'){html+=`<div class="field">${propInput('Grosor (m)','thickness',o.thickness,.05)}${propInput('Altura (m)','height',o.height,.1)}</div><div class="field">${propInput('X1','x1',o.x1,.05)}${propInput('Y1','y1',o.y1,.05)}</div><div class="field">${propInput('X2','x2',o.x2,.05)}${propInput('Y2','y2',o.y2,.05)}</div><div class="card small">Longitud: <b>${wallLen(o).toFixed(2)} m</b></div>`}else if(o.type==='room'||['pool','terrace','garage','garden'].includes(o.type)){html+=`<div class="full"><label>Nombre<input data-key="name" value="${o.name||TYPES[o.type]||''}"></label></div><div class="field">${propInput('X','x',o.x,.05)}${propInput('Y','y',o.y,.05)}</div><div class="field">${propInput('Ancho (m)','w',o.w,.1)}${propInput('Fondo (m)','h',o.h,.1)}</div><div class="card small">Superficie: <b>${roomArea(o).toFixed(2)} m²</b></div>`}else if(o.x!=null){html+=`<div class="field">${propInput('X','x',o.x,.05)}${propInput('Y','y',o.y,.05)}</div><div class="field">${propInput('Ancho','w',o.w,.1)}${propInput('Fondo','h',o.h,.1)}</div>${propInput('Rotación','rotation',o.rotation||0,5)}`}else{html+=`<div class="field">${propInput('X1','x1',o.x1,.05)}${propInput('Y1','y1',o.y1,.05)}</div><div class="field">${propInput('X2','x2',o.x2,.05)}${propInput('Y2','y2',o.y2,.05)}</div>`}html+=`<button id="delete" class="danger">Eliminar elemento</button>`;props.innerHTML=html;props.querySelectorAll('input[data-key]').forEach(inp=>inp.onchange=()=>{saveHist();let k=inp.dataset.key;o[k]=k==='name'?inp.value:parseFloat(inp.value)||0;persist();draw();showProps()});document.getElementById('delete').onclick=()=>{saveHist();project.floors[floor].objects=cur().filter(a=>a.id!==o.id);selected=null;persist();showProps();draw()}}
function bindGeneral(){document.getElementById('floors').onclick=showFloors;document.getElementById('budget').onclick=showBudget;document.getElementById('export').onclick=exportJSON;document.getElementById('import').onclick=importJSON}
function showFloors(){modal.classList.remove('hidden');modalbox.innerHTML=`<h2>Plantas</h2><div class="list">${project.floors.map((f,i)=>`<div class="item"><span>${i} · ${f.name}</span><button data-floor="${i}">Abrir</button></div>`).join('')}</div><div class="row"><button id="addFloor">+ Añadir planta</button><button id="close">Cerrar</button></div>`;modalbox.querySelectorAll('[data-floor]').forEach(b=>b.onclick=()=>{floor=+b.dataset.floor;modal.classList.add('hidden');document.getElementById('floorBtn').textContent=project.floors[floor].name;selected=null;showProps();draw()});document.getElementById('addFloor').onclick=()=>{saveHist();project.floors.push({name:'Planta '+project.floors.length,height:2.7,objects:[]});persist();showFloors()};document.getElementById('close').onclick=()=>modal.classList.add('hidden')}
function calcBudget(){let o=cur(),total=0,lines=[];let walls=o.filter(a=>a.type==='wall'),rooms=o.filter(a=>a.type==='room');let wl=walls.reduce((s,a)=>s+wallLen(a),0);if(wl){let v=wl*project.prices.wall;total+=v;lines.push(['Muros',wl.toFixed(2)+' m',v])}let fa=rooms.reduce((s,a)=>s+roomArea(a),0);if(fa){let v=fa*project.prices.floor;total+=v;lines.push(['Suelo',fa.toFixed(2)+' m²',v])}let roof=fa*project.prices.roof; if(fa){total+=roof;lines.push(['Techo',fa.toFixed(2)+' m²',roof])}let wood=o.filter(a=>['sofa','bed','table','wardrobe','kitchen','bath'].includes(a.type)).length*project.prices.wood; if(wood){total+=wood;lines.push(['Equipamiento',String(o.filter(a=>['sofa','bed','table','wardrobe','kitchen','bath'].includes(a.type)).length)+' ud',wood])}return{lines,total}}
function showBudget(){let b=calcBudget();modal.classList.remove('hidden');modalbox.innerHTML=`<h2>Presupuesto estimado</h2><div class="small">Valores orientativos editables; no sustituyen un presupuesto profesional.</div><div class="list">${b.lines.map(l=>`<div class="item"><span>${l[0]} · ${l[1]}</span><b>${l[2].toLocaleString('es-ES',{minimumFractionDigits:2})} €</b></div>`).join('')||'<p>No hay elementos suficientes todavía.</p>'}</div><div class="card"><div class="big">Total estimado: ${b.total.toLocaleString('es-ES',{minimumFractionDigits:2})} €</div></div><div class="row"><button id="prices">Editar precios</button><button id="close">Cerrar</button></div>`;document.getElementById('prices').onclick=()=>{modalbox.innerHTML=`<h2>Precios</h2><div class="field">${propInput('Muros €/m','wall',project.prices.wall,1)}${propInput('Suelo €/m²','floor',project.prices.floor,1)}</div><div class="field">${propInput('Techo €/m²','roof',project.prices.roof,1)}${propInput('Madera/equip. €/ud','wood',project.prices.wood,1)}</div><button id="savePrices">Guardar</button>`;document.getElementById('savePrices').onclick=()=>{modalbox.querySelectorAll('input').forEach(i=>project.prices[i.dataset.key]=parseFloat(i.value)||0);persist();showBudget()}};document.getElementById('close').onclick=()=>modal.classList.add('hidden')}
function exportJSON(){let blob=new Blob([JSON.stringify(project,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='casa3d-proyecto.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function importJSON(){let input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.onchange=()=>{let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{saveHist();project=JSON.parse(r.result);floor=0;persist();showProps();draw();toastMsg('Proyecto importado')}catch(e){toastMsg('Archivo no válido')}};r.readAsText(f)};input.click()}
function saveNow(){persist();toastMsg('Guardado en este iPad')}
function undo(){if(!history.length)return;future.push(JSON.stringify(project));project=JSON.parse(history.pop());floor=Math.min(floor,project.floors.length-1);persist();selected=null;showProps();draw()}function redo(){if(!future.length)return;history.push(JSON.stringify(project));project=JSON.parse(future.pop());floor=Math.min(floor,project.floors.length-1);persist();selected=null;showProps();draw()}
function clearAll(){saveHist();cur().length=0;selected=null;persist();showProps();draw()}
document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));c.onpointerdown=pointerDown;c.onpointermove=pointerMove;c.onpointerup=pointerUp;c.onpointercancel=()=>drag=null;window.onresize=resize;
document.getElementById('undo').onclick=undo;document.getElementById('redo').onclick=redo;document.getElementById('save').onclick=saveNow;document.getElementById('clear').onclick=()=>{if(confirm('¿Limpiar esta planta?'))clearAll()};document.getElementById('floorBtn').onclick=showFloors;document.getElementById('view2d').onclick=()=>{view='2d';document.getElementById('view2d').classList.add('active');document.getElementById('view3d').classList.remove('active');hint.textContent='Vista 2D: toca o arrastra según la herramienta.';draw()};document.getElementById('view3d').onclick=()=>{view='3d';document.getElementById('view3d').classList.add('active');document.getElementById('view2d').classList.remove('active');hint.textContent='Vista 3D: representación isométrica de la planta.';draw()};document.getElementById('walk').onclick=()=>{view='3d';document.getElementById('view3d').classList.add('active');document.getElementById('view2d').classList.remove('active');toastMsg('Recorrido preparado: usa la vista 3D para revisar el volumen') ;draw()};document.getElementById('more').onclick=()=>showBudget();
load();document.getElementById('floorBtn').textContent=project.floors[floor].name;showProps();resize();
})();
</script></body></html>
