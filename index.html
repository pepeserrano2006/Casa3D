<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Casa3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef1f5;color:#172033;overflow:hidden}
button,input{font:inherit}button{min-height:44px;border:1px solid #d7dce5;background:#fff;border-radius:10px;padding:8px 10px;color:#172033}
.app{height:100%;display:grid;grid-template-rows:58px 1fr}.top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#111827;color:#fff}.brand{font-weight:800;font-size:20px;margin-right:auto}.mode button{color:#111827}.mode .active{background:#dbeafe;border-color:#93c5fd}
.body{min-height:0;display:grid;grid-template-columns:230px minmax(0,1fr) 250px}.left,.right{background:#f8fafc;overflow:auto;padding:10px;border-right:1px solid #d8dee8}.right{border-right:0;border-left:1px solid #d8dee8}
.panel-title{font-weight:800;margin:5px 2px 10px}.group{margin-bottom:12px}.group h3{font-size:13px;color:#667085;margin:10px 3px 6px}.toolgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.tool{min-height:48px;text-align:left}.tool.active{background:#dbeafe;border-color:#60a5fa}
.canvas-wrap{position:relative;min-width:0;min-height:0;background:#fff;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none;background-color:#fff;background-image:linear-gradient(#e7ebf1 1px,transparent 1px),linear-gradient(90deg,#e7ebf1 1px,transparent 1px);background-size:20px 20px}
.hint{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.92);border:1px solid #d8dee8;border-radius:10px;padding:8px 10px;font-size:13px;pointer-events:none}.bottom{position:absolute;left:12px;right:12px;bottom:12px;display:flex;gap:8px;justify-content:center;pointer-events:none}.bottom button{pointer-events:auto}
.field{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:8px}.field label{font-size:12px;color:#667085;display:flex;flex-direction:column;gap:4px}input{min-height:42px;border:1px solid #d7dce5;border-radius:9px;padding:7px;background:#fff}.status{font-size:13px;color:#667085;line-height:1.4}.area{font-size:18px;font-weight:800;margin:4px 0 12px}
@media(max-width:850px){.body{grid-template-columns:190px minmax(0,1fr)}.right{display:none}.left{padding:8px}.toolgrid{grid-template-columns:1fr}.brand{font-size:18px}}
@media(max-width:620px){.body{grid-template-columns:82px minmax(0,1fr)}.left{padding:6px}.panel-title,.group h3{display:none}.toolgrid{gap:5px}.tool{font-size:11px;text-align:center;padding:6px 3px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">Casa3D</div><div class="mode"><button id="selectMode" class="active">Seleccionar</button><button id="walkMode">Recorrido</button></div></header>
<div class="body">
<aside class="left">
<div class="panel-title">Herramientas</div>
<div class="group"><h3>Construcción</h3><div class="toolgrid">
<button class="tool active" data-tool="select">↖ Seleccionar</button><button class="tool" data-tool="wall">▰ Pared</button><button class="tool" data-tool="room">□ Habitación</button><button class="tool" data-tool="door">🚪 Puerta</button><button class="tool" data-tool="window">▣ Ventana</button><button class="tool" data-tool="stairs">▤ Escalera</button></div></div>
<div class="group"><h3>Interior</h3><div class="toolgrid"><button class="tool" data-tool="furniture">Sofá</button><button class="tool" data-tool="kitchen">Cocina</button><button class="tool" data-tool="bath">Baño</button></div></div>
<div class="group"><h3>Materiales</h3><div class="toolgrid"><button class="tool" data-tool="material-wall">Pared</button><button class="tool" data-tool="material-floor">Suelo</button><button class="tool" data-tool="material-roof">Techo</button><button class="tool" data-tool="material-wood">Madera</button></div></div>
<div class="group"><h3>Líneas</h3><div class="toolgrid"><button class="tool" data-tool="measure">📏 Medir</button><button class="tool" data-tool="guide">Guía</button></div></div>
</aside>
<main class="canvas-wrap"><canvas id="canvas"></canvas><div class="hint" id="hint">Seleccionar: toca un elemento. No dibuja.</div><div class="bottom"><button id="undo">↶ Deshacer</button><button id="redo">↷ Rehacer</button><button id="clear">Limpiar</button></div></main>
<aside class="right"><div class="panel-title">Propiedades</div><div class="area">Proyecto Casa3D</div><div class="field"><label>Ancho (m)<input type="number" value="10"></label><label>Alto (m)<input type="number" value="8"></label></div><div class="field"><label>Grosor (cm)<input type="number" value="20"></label><label>Altura (m)<input type="number" value="2.7"></label></div><p class="status" id="status">Modo selección activo. Los toques no dibujan líneas.</p></aside>
</div></div>
<script>
(()=>{const c=document.getElementById('canvas'),x=c.getContext('2d'),hint=document.getElementById('hint'),status=document.getElementById('status');let dpr=1,tool='select',drag=null,objects=[],history=[],future=[];function resize(){dpr=Math.min(devicePixelRatio||1,2);let r=c.getBoundingClientRect();c.width=Math.max(1,r.width*dpr);c.height=Math.max(1,r.height*dpr);x.setTransform(dpr,0,0,dpr,0,0);draw()}function snap(v){return Math.round(v/10)*10}function pos(e){let r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function save(){history.push(JSON.stringify(objects));if(history.length>40)history.shift();future=[]}function draw(){x.clearRect(0,0,c.clientWidth,c.clientHeight);objects.forEach(o=>{x.lineCap='round';if(o.type==='wall'){x.strokeStyle='#273244';x.lineWidth=8;x.beginPath();x.moveTo(o.x1,o.y1);x.lineTo(o.x2,o.y2);x.stroke()}else if(o.type==='room'){x.strokeStyle='#64748b';x.lineWidth=2;x.strokeRect(o.x,o.y,o.w,o.h)}else if(o.type==='door'||o.type==='window'){x.strokeStyle=o.type==='door'?'#2563eb':'#16a34a';x.lineWidth=5;x.beginPath();x.moveTo(o.x-18,o.y);x.lineTo(o.x+18,o.y);x.stroke()}else{x.strokeStyle='#64748b';x.lineWidth=2;x.strokeRect(o.x,o.y,55,32)}});if(drag){x.strokeStyle='#2563eb';x.lineWidth=8;x.beginPath();x.moveTo(drag.x1,drag.y1);x.lineTo(drag.x2,drag.y2);x.stroke()}}function setTool(t){tool=t;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('active',b.dataset.tool===t));let m={select:'Seleccionar: toca un elemento. No dibuja.',wall:'Pared: toca y arrastra.',room:'Habitación: toca y arrastra.',door:'Puerta: toca para colocar.',window:'Ventana: toca para colocar.',stairs:'Escalera: toca para colocar.',furniture:'Mueble: toca para colocar.',kitchen:'Cocina: toca para colocar.',bath:'Baño: toca para colocar.',measure:'Medir: toca y arrastra.',guide:'Guía: toca y arrastra.'};hint.textContent=m[t]||'Seleccionar';status.textContent=m[t]||''}document.querySelectorAll('.tool').forEach(b=>b.onclick=()=>setTool(b.dataset.tool));document.getElementById('undo').onclick=()=>{if(history.length){future.push(JSON.stringify(objects));objects=JSON.parse(history.pop());draw()}};document.getElementById('redo').onclick=()=>{if(future.length){history.push(JSON.stringify(objects));objects=JSON.parse(future.pop());draw()}};document.getElementById('clear').onclick=()=>{save();objects=[];draw()};c.onpointerdown=e=>{if(tool==='select')return;e.preventDefault();c.setPointerCapture(e.pointerId);let p=pos(e);if(['wall','room','measure','guide'].includes(tool))drag={x1:snap(p.x),y1:snap(p.y),x2:snap(p.x),y2:snap(p.y)};else{save();objects.push({type:tool,x:snap(p.x),y:snap(p.y)})}draw()};c.onpointermove=e=>{if(!drag)return;e.preventDefault();let p=pos(e);drag.x2=snap(p.x);drag.y2=snap(p.y);draw()};c.onpointerup=e=>{if(!drag)return;e.preventDefault();save();let d=drag;drag=null;if(tool==='wall')objects.push({type:'wall',x1:d.x1,y1:d.y1,x2:d.x2,y2:d.y2});else if(tool==='room')objects.push({type:'room',x:Math.min(d.x1,d.x2),y:Math.min(d.y1,d.y2),w:Math.abs(d.x2-d.x1),h:Math.abs(d.y2-d.y1)});else objects.push({type:tool,x1:d.x1,y1:d.y1,x2:d.x2,y2:d.y2});draw()};window.onresize=resize;resize()})()
</script></body></html>
